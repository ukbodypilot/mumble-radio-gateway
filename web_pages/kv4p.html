<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV4P — Radio Gateway</title>
<link rel="stylesheet" href="/pages/common.css">
<style>
  /* Two KV4P panels side-by-side on wide screens, stack on narrow.
     Each panel is self-contained and scopes its DOM lookups via class
     selectors inside the panel root, so the markup can be duplicated
     per instance without ID collisions. */
  .kv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: var(--s-3);
    align-items: start;
  }
  .kv-panel-root { display: flex; flex-direction: column; gap: var(--s-2); }

  /* Title strip for each radio */
  .kv-title-bar {
    display: flex; align-items: baseline; gap: var(--s-2);
    padding: var(--s-1) var(--s-2);
    border-bottom: 1px solid var(--t-border);
    margin-bottom: var(--s-2);
  }
  .kv-title-bar .kv-instance {
    font-weight: 600; font-size: var(--f-md);
    color: var(--t-accent); letter-spacing: 0.06em;
  }
  .kv-title-bar .kv-instance-sub {
    font-size: var(--f-xs); color: var(--t-text-dim);
  }

  /* Status row */
  .kv-meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-2);
             font-size: var(--f-sm); }
  .kv-meta .sep { color: var(--t-border); }
  .kv-label { color: var(--t-text-dim); }
  .kv-val   { color: var(--t-text); }
  .kv-val.ok  { color: var(--t-ok); }
  .kv-val.err { color: var(--t-err); }
  .kv-val.warn{ color: var(--t-warn); }

  .kv-tx-badge {
    display: none; background: var(--t-err); color: var(--t-bg);
    padding: 1px var(--s-1); border-radius: var(--r-sm);
    font-weight: 700; font-size: var(--f-xs); letter-spacing: 0.08em;
  }
  .kv-tx-badge.on { display: inline-block; }

  /* Frequency display — compact for side-by-side */
  .kv-freq-box { text-align: center; padding: var(--s-2) 0; }
  .kv-freq-box.tx-active {
    background: color-mix(in srgb, var(--t-err) 18%, var(--t-panel));
    border-radius: var(--r-md);
  }
  .kv-freq {
    color: var(--t-ok); font-size: 24px; letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .kv-freq.tx { color: var(--t-warn); font-size: 16px; }
  .kv-freq-row { display: flex; align-items: baseline; justify-content: center; gap: var(--s-2); }
  .kv-freq-row.split { margin-top: 2px; }

  /* Meters */
  .kv-meter-row { display: flex; align-items: center; gap: var(--s-2); margin: 2px 0; }
  .kv-meter-row .kv-label.w { min-width: 50px; font-size: var(--f-xs); }
  .kv-meter {
    flex: 1; background: var(--t-bg);
    border: 1px solid var(--t-border); border-radius: var(--r-sm);
    height: 12px; position: relative; overflow: hidden;
  }
  .kv-meter-fill {
    height: 100%; width: 0%; transition: width 0.2s; background: var(--t-ok);
  }
  .kv-meter.accent .kv-meter-fill { background: var(--t-accent); }
  .kv-meter-text {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: var(--f-xs); color: var(--t-text); font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Compact controls grid — 2 cols inside each panel */
  .kv-ctrl-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s-2) var(--s-3);
    align-items: end;
  }
  .kv-ctrl { display: flex; flex-direction: column; gap: 2px; }
  .kv-ctrl > .kv-label { font-size: var(--f-xs); }
  .kv-ctrl-inline { display: flex; gap: var(--s-1); align-items: center; }
  .kv-ctrl-inline input[type="range"] { flex: 1; min-width: 0; }
  .kv-input {
    background: var(--t-btn); border: 1px solid var(--t-border);
    color: var(--t-ok); padding: 2px var(--s-1); border-radius: var(--r-sm);
    font-family: inherit; font-size: var(--f-sm);
    width: 100%; min-width: 0; text-align: center;
  }
  .kv-select {
    background: var(--t-btn); border: 1px solid var(--t-border);
    color: var(--t-text); padding: 2px var(--s-1); border-radius: var(--r-sm);
    font-family: inherit; font-size: var(--f-sm); width: 100%; min-width: 0;
  }
  .kv-row-buttons { display: flex; gap: var(--s-1); flex-wrap: wrap; }
  .kv-feedback { font-size: var(--f-xs); min-width: 4em; }

  /* Hide TX freq row by default */
  .kv-tx-freq-row { display: none; }
  .kv-tx-freq-row.shown { display: flex; }
</style>
</head><body>

<div id="kv-grid" class="kv-grid"></div>

<script src="/pages/common.js"></script>
<script>
// ── Per-instance KV4P panel controller ──────────────────────────────────
// Each radio gets its own DOM root (built from buildPanel) and its own
// poller + command sender. All DOM lookups are scoped to the panel root
// so VHF and UHF don't collide on IDs/classes.

var KV4P_CTCSS = ["67.0","71.9","74.4","77.0","79.7","82.5","85.4","88.5",
  "91.5","94.8","97.4","100.0","103.5","107.2","110.9","114.8","118.8",
  "123.0","127.3","131.8","136.5","141.3","146.2","151.4","156.7","162.2",
  "167.9","173.8","179.9","186.2","192.8","203.5","210.7","218.1","225.7",
  "233.6","241.8","250.3"];

function _ctcssCode2Hz(code) {
  if (!code || code <= 0) return '0';
  var t = KV4P_CTCSS[code - 1];
  return t !== undefined ? t : '0';
}

function _ctcssOpts(selected) {
  var html = '<option value="0">None</option>';
  for (var i = 0; i < KV4P_CTCSS.length; i++) {
    html += '<option value="' + KV4P_CTCSS[i] + '">' + KV4P_CTCSS[i] + ' Hz</option>';
  }
  return html;
}

// Build a single panel for an instance ('vhf', 'uhf', ...). Returns the
// panel root element (caller appends to .kv-grid). All interactive bits
// are class-tagged so panel.querySelector('.<class>') finds them.
function buildPanel(instance, label, sublabel) {
  var root = document.createElement('div');
  root.className = 'kv-panel-root';
  root.dataset.instance = instance;
  root.innerHTML = `
    <div class="panel">
      <div class="kv-title-bar">
        <span class="kv-instance">${label}</span>
        <span class="kv-instance-sub">${sublabel}</span>
        <span style="flex:1"></span>
        <span class="kv-tx-badge">TX</span>
      </div>

      <div class="kv-offline" style="display:none;">
        <span class="kv-val err" style="font-weight:600">Not Connected</span>
        <span class="kv-status-detail kv-label" style="margin-left:var(--s-2)"></span>
        <button class="rb rb-sm" style="margin-left:var(--s-2)" data-cmd="reconnect">Reconnect</button>
      </div>

      <div class="kv-body" style="display:none;">
        <div class="kv-meta">
          <span class="kv-label">FW:</span> <span class="kv-fw kv-val">—</span>
          <span class="sep">|</span>
          <span class="kv-label">Module:</span> <span class="kv-module kv-val">—</span>
          <span class="sep">|</span>
          <span class="kv-label">Audio:</span> <span class="kv-audio-status kv-val">—</span>
          <span style="flex:1"></span>
          <span class="kv-feedback"></span>
        </div>

        <div class="kv-freq-box">
          <div class="kv-freq-row">
            <span class="kv-rx-label kv-label">RX</span>
            <span class="kv-rx-freq kv-freq">—</span>
            <span class="kv-label">MHz</span>
          </div>
          <div class="kv-tx-freq-row kv-freq-row split">
            <span class="kv-tx-label kv-label">TX</span>
            <span class="kv-tx-freq kv-freq tx">—</span>
            <span class="kv-label">MHz</span>
          </div>
        </div>

        <div class="kv-meter-row">
          <span class="kv-label w">S-meter</span>
          <div class="kv-sig-meter kv-meter">
            <div class="kv-meter-fill"></div>
            <div class="kv-meter-text">S0</div>
          </div>
        </div>
        <div class="kv-meter-row">
          <span class="kv-label w">Audio</span>
          <div class="kv-audio-meter kv-meter accent">
            <div class="kv-meter-fill"></div>
            <div class="kv-meter-text">0%</div>
          </div>
        </div>

        <div class="kv-row-buttons" style="margin-top:var(--s-2)">
          <button class="rb rb-sm kv-ptt-btn" data-cmd="ptt">PTT</button>
          <button class="rb rb-sm" data-cmd="testtone" data-args="400">Tone 400</button>
          <button class="rb rb-sm" data-cmd="testtone" data-args="1000">Tone 1k</button>
          <button class="rb rb-sm" data-cmd="testtone">Stop</button>
          <span style="flex:1"></span>
          <button class="rb rb-sm" data-cmd="reconnect">Reconnect</button>
        </div>

        <div class="kv-ctrl-grid" style="margin-top:var(--s-2)">
          <div class="kv-ctrl">
            <span class="kv-label">RX Freq (MHz)</span>
            <div class="kv-ctrl-inline">
              <input class="kv-freq-input kv-input" type="text" placeholder="147.435">
              <button class="rb rb-sm" data-set="freq" data-from=".kv-freq-input">Set</button>
            </div>
          </div>
          <div class="kv-ctrl">
            <span class="kv-label">TX Freq (0=same)</span>
            <div class="kv-ctrl-inline">
              <input class="kv-txfreq-input kv-input" type="text" placeholder="0">
              <button class="rb rb-sm" data-set="txfreq" data-from=".kv-txfreq-input">Set</button>
            </div>
          </div>

          <div class="kv-ctrl">
            <span class="kv-label">Squelch (0–8) <span class="kv-sq-val">4</span></span>
            <input class="kv-squelch" type="range" min="0" max="8" value="4">
          </div>
          <div class="kv-ctrl">
            <span class="kv-label">Volume <span class="kv-vol-val">100%</span></span>
            <input class="kv-vol" type="range" min="0" max="500" value="100">
          </div>

          <div class="kv-ctrl">
            <span class="kv-label">Power</span>
            <select class="kv-power kv-select">
              <option value="high">High</option><option value="low">Low</option>
            </select>
          </div>
          <div class="kv-ctrl">
            <span class="kv-label">Bandwidth</span>
            <select class="kv-bw kv-select">
              <option value="wide">Wide 25k</option><option value="narrow">Narrow 12.5k</option>
            </select>
          </div>

          <div class="kv-ctrl">
            <span class="kv-label">CTCSS TX</span>
            <select class="kv-ctcss-tx kv-select">${_ctcssOpts()}</select>
          </div>
          <div class="kv-ctrl">
            <span class="kv-label">CTCSS RX</span>
            <select class="kv-ctcss-rx kv-select">${_ctcssOpts()}</select>
          </div>
          <div class="kv-ctrl" style="grid-column:1/-1">
            <button class="rb rb-sm" data-set="ctcss-pair">Set CTCSS pair</button>
          </div>
        </div>
      </div><!-- /kv-body -->
    </div><!-- /panel -->
  `;
  return root;
}

// Per-instance controller — wires up DOM events scoped to root, polls
// /kv4pstatus?instance=X, posts commands with instance in the body.
function Kv4pCtrl(root, instance) {
  this.root = root;
  this.instance = instance;
  this._editUntil = 0;
  this._setupHandlers();
  this._poller = createPoller('/kv4pstatus?instance=' + encodeURIComponent(instance),
                              1500, this._update.bind(this));
}

Kv4pCtrl.prototype._q = function(sel) { return this.root.querySelector(sel); };

Kv4pCtrl.prototype.cmd = function(cmd, args) {
  var self = this;
  var body = {cmd: cmd, instance: this.instance};
  if (args !== undefined) body.args = String(args);
  return postJson('/kv4pcmd', body).then(function(d) {
    var fb = self._q('.kv-feedback');
    if (d.ok) {
      fb.className = 'kv-feedback kv-val ok';
      fb.textContent = d.response || 'OK';
    } else {
      fb.className = 'kv-feedback kv-val err';
      fb.textContent = d.error || 'Error';
    }
    setTimeout(function() {
      fb.textContent = ''; fb.className = 'kv-feedback';
    }, 4000);
    return d;
  });
};

Kv4pCtrl.prototype._editLock = function(ms) {
  this._editUntil = Date.now() + (ms || 3000);
};

Kv4pCtrl.prototype._setupHandlers = function() {
  var self = this;
  // Buttons with data-cmd fire kvCmd(cmd, args)
  this.root.querySelectorAll('[data-cmd]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      self.cmd(btn.dataset.cmd, btn.dataset.args);
    });
  });
  // "Set" buttons that read from a sibling input
  this.root.querySelectorAll('[data-set]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var kind = btn.dataset.set;
      if (kind === 'ctcss-pair') {
        var tx = self._q('.kv-ctcss-tx').value;
        var rx = self._q('.kv-ctcss-rx').value;
        self.cmd('ctcss', tx + ' ' + rx);
      } else if (btn.dataset.from) {
        var input = self._q(btn.dataset.from);
        self.cmd(kind, input ? input.value : '');
      }
    });
  });
  // Inputs that should lock the field briefly so the next poll doesn't
  // yank a value the user is mid-edit on.
  this.root.querySelectorAll('input, select').forEach(function(el) {
    el.addEventListener('focus', function() { self._editLock(5000); });
  });
  // Sliders / dropdowns that POST on change
  var sq = this._q('.kv-squelch');
  sq.addEventListener('input', function() {
    self._editLock(3000); self._q('.kv-sq-val').textContent = sq.value;
  });
  sq.addEventListener('change', function() {
    self._editLock(3000); self.cmd('squelch', sq.value);
  });
  var vol = this._q('.kv-vol');
  vol.addEventListener('input', function() {
    self._editLock(3000); self._q('.kv-vol-val').textContent = vol.value + '%';
  });
  vol.addEventListener('change', function() {
    self._editLock(3000); self.cmd('vol', vol.value);
  });
  this._q('.kv-power').addEventListener('change', function() {
    self._editLock(3000); self.cmd('power', this.value);
  });
  this._q('.kv-bw').addEventListener('change', function() {
    self._editLock(3000); self.cmd('bandwidth', this.value);
  });
};

Kv4pCtrl.prototype._update = function(d) {
  var offline = this._q('.kv-offline');
  var body = this._q('.kv-body');
  if (!d.kv4p_enabled || !d.connected) {
    offline.style.display = 'block';
    body.style.display = 'none';
    this._q('.kv-status-detail').textContent = !d.kv4p_enabled
      ? 'KV4P disabled in config'
      : 'Not connected — check USB';
    return;
  }
  offline.style.display = 'none';
  body.style.display = 'block';

  this._q('.kv-fw').textContent = 'v' + (d.firmware_version || '?');
  this._q('.kv-module').textContent = d.rf_module || '?';
  this._q('.kv-audio-status').textContent = d.audio_connected ? 'Connected' : 'No codec';
  var tx = !!d.transmitting;
  this.root.querySelector('.kv-tx-badge').classList.toggle('on', tx);
  this._q('.kv-freq-box').classList.toggle('tx-active', tx);

  // Frequency display (same split-aware logic as before)
  var rxf = d.frequency || '0.000000';
  var txf = d.tx_frequency || rxf;
  var isSplit = (txf !== rxf);
  var txFreqRow = this._q('.kv-tx-freq-row');
  if (tx && isSplit) {
    this._q('.kv-rx-label').textContent = 'TX';
    this._q('.kv-rx-freq').textContent = parseFloat(txf).toFixed(4);
    txFreqRow.classList.add('shown');
    this._q('.kv-tx-label').textContent = 'RX';
    this._q('.kv-tx-freq').textContent = parseFloat(rxf).toFixed(4);
  } else if (isSplit) {
    this._q('.kv-rx-label').textContent = 'RX';
    this._q('.kv-rx-freq').textContent = parseFloat(rxf).toFixed(4);
    txFreqRow.classList.add('shown');
    this._q('.kv-tx-label').textContent = 'TX';
    this._q('.kv-tx-freq').textContent = parseFloat(txf).toFixed(4);
  } else {
    this._q('.kv-rx-label').textContent = 'RX';
    this._q('.kv-rx-freq').textContent = parseFloat(rxf).toFixed(4);
    txFreqRow.classList.remove('shown');
  }

  // S-meter
  var raw = d.signal || 0;
  var s = Math.round(raw * 9 / 255);
  var pct = Math.min(100, Math.round(raw * 100 / 255));
  var sigMeter = this._q('.kv-sig-meter');
  if (window.RG && RG.vu) RG.vu.set(sigMeter, pct);
  else sigMeter.querySelector('.kv-meter-fill').style.width = pct + '%';
  sigMeter.querySelector('.kv-meter-text').textContent = 'S' + s + ' (' + raw + ')';

  // Audio meter
  var aLvl = Math.round(d.audio_level || 0);
  var aMeter = this._q('.kv-audio-meter');
  if (window.RG && RG.vu) RG.vu.set(aMeter, Math.min(100, aLvl));
  else aMeter.querySelector('.kv-meter-fill').style.width = Math.min(100, aLvl) + '%';
  aMeter.querySelector('.kv-meter-text').textContent = aLvl + '%';

  // Editable controls — skip if user is actively editing
  if (Date.now() > this._editUntil) {
    var af = document.activeElement;
    var skip = function(el) { return el === af; };
    var set = function(sel, val) {
      var el = this._q(sel);
      if (el && !skip(el)) el.value = val;
    }.bind(this);
    set('.kv-squelch', d.squelch || 4);
    this._q('.kv-sq-val').textContent = d.squelch || 4;
    set('.kv-power', d.high_power ? 'high' : 'low');
    set('.kv-bw', (d.bandwidth === 0) ? 'narrow' : 'wide');
    set('.kv-ctcss-tx', _ctcssCode2Hz(d.ctcss_tx));
    set('.kv-ctcss-rx', _ctcssCode2Hz(d.ctcss_rx));
    if (d.audio_boost !== undefined) {
      set('.kv-vol', d.audio_boost);
      this._q('.kv-vol-val').textContent = d.audio_boost + '%';
    }
  }
};

// ── Bootstrap: discover instances from /kv4pinstances or render hardcoded
// VHF + UHF pair. The status endpoint will gracefully tell us if either
// is disabled/disconnected.
(function init() {
  var grid = document.getElementById('kv-grid');
  var panels = [
    {instance: 'vhf', label: 'KV4P VHF', sub: '/dev/kv4p-vhf'},
    {instance: 'uhf', label: 'KV4P UHF', sub: '/dev/kv4p-uhf'},
  ];
  panels.forEach(function(p) {
    var root = buildPanel(p.instance, p.label, p.sub);
    grid.appendChild(root);
    new Kv4pCtrl(root, p.instance);
  });
})();
</script>
</body></html>
